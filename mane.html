<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketGuide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:wght@500;600&family=Noto+Sans+Armenian:wght@400;600&family=Noto+Serif+Armenian:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--g:#1f4d3a;--ink:#22262a;--sage:#9fb5a3;--gold:#c5a35a;--mut:#667068;--ln:#e3dccb;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:radial-gradient(900px 480px at 88% -4%,#e6eee3,transparent),radial-gradient(700px 400px at -5% 40%,#f3ead2,transparent),var(--bg);color:var(--ink);font:16px/1.65 Inter,'Noto Sans Armenian',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,h4{font-family:Newsreader,'Noto Serif Armenian',Georgia,serif;line-height:1.18;margin:0 0 .5em;font-weight:600;color:var(--g)}
h1{font-size:clamp(34px,5.6vw,60px)}h2{font-size:clamp(28px,3.6vw,42px)}h3{font-size:24px}h4{font-size:18px}
p{margin:0 0 1em}a{color:inherit}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
section{padding:80px 0;position:relative}
section:nth-of-type(even){background:linear-gradient(180deg,rgba(159,181,163,.14),transparent 70%)}
.lead{font-size:18px;color:var(--mut);max-width:62ch}
.note{color:var(--mut);font-size:15px;border-left:3px solid var(--gold);padding-left:14px;max-width:70ch}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{position:sticky;top:0;z-index:30;background:rgba(247,243,234,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:600 20px Newsreader,serif;text-decoration:none;color:var(--g);margin-right:auto}
.logo svg{width:30px;height:30px}
nav{display:flex;gap:2px}
nav a{padding:8px 11px;border-radius:99px;text-decoration:none;font-size:14px;color:var(--mut);transition:.25s}
nav a:hover,nav a.on{background:rgba(31,77,58,.09);color:var(--g)}
.lg{display:flex;background:rgba(31,77,58,.07);border-radius:99px;padding:3px}
.lg button{border:0;background:none;padding:6px 11px;border-radius:99px;font:600 12px Inter,sans-serif;color:var(--mut);cursor:pointer;transition:.25s}
.lg button.on{background:var(--g);color:#fff}
#mb{display:none;border:0;background:none;width:40px;height:40px;cursor:pointer;color:var(--g)}
@media(max-width:1060px){#mb{display:block}nav{position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);padding:10px 20px 16px;border-bottom:1px solid var(--ln);display:none}nav.open{display:flex}}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--g);color:#fff;padding:13px 24px;border-radius:14px;font:600 15px Inter,'Noto Sans Armenian',sans-serif;text-decoration:none;box-shadow:0 10px 24px -12px rgba(31,77,58,.7);transition:.25s}
.btn:hover{transform:translateY(-2px);background:#17402f}
.btn.alt{background:transparent;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:22px;box-shadow:0 18px 40px -26px rgba(31,77,58,.45);transition:.3s}
.two{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
.g3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:30px}
.fcard:hover,.cc:hover{transform:translateY(-5px);border-color:var(--gold)}
.fcard i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(197,163,90,.2);color:#8a6d27;font:600 14px Inter;font-style:normal;margin-bottom:12px}
.fcard p{color:var(--mut);font-size:15px;margin:0}
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
.js .rv.in{opacity:1;transform:none}
/* hero */
.hero{padding:70px 0 90px;overflow:hidden}
.hg{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));align-items:center}
.hw{perspective:1000px}
.hv{position:relative;height:400px;transform-style:preserve-3d;transform:rotateY(calc(var(--mx,0)*7deg)) rotateX(calc(var(--my,0)*-6deg));transition:transform .25s}
.hv>svg{position:absolute;inset:0;width:100%;height:100%;background:rgba(255,253,248,.7);border:1px solid var(--ln);border-radius:28px;box-shadow:0 30px 60px -30px rgba(31,77,58,.5)}
.hp{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:dr 2.2s .3s forwards}
.hp.b{stroke:var(--gold)}.hp.a{stroke:var(--g)}
@keyframes dr{to{stroke-dashoffset:0}}
.fl{position:absolute;background:rgba(255,253,248,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:16px;padding:10px 16px;box-shadow:0 16px 34px -18px rgba(0,0,0,.35);translate:calc(var(--mx,0)*var(--k)*1px) calc(var(--my,0)*var(--k)*1px) var(--z);animation:fy 5s ease-in-out infinite}
.fl small{display:block;color:var(--mut);font-size:12px}.fl b{color:var(--g);font-size:18px}
.fl:nth-of-type(2n){animation-delay:-2s}
@keyframes fy{50%{transform:translateY(-10px)}}
/* diagram */
#mdg{width:100%;max-width:640px;display:block;margin:auto}
.nd{cursor:pointer}.nd rect,.nd circle{fill:#fff;stroke:var(--sage);stroke-width:1.6;transition:.3s}
.nd text{text-anchor:middle;font:600 12px Inter,'Noto Sans Armenian',sans-serif;fill:var(--ink);pointer-events:none}
.nd:hover rect,.nd:hover circle,.nd.on rect,.nd.on circle{fill:var(--g);stroke:var(--g)}
.nd.on:not(:has(rect,circle)) text{fill:var(--gold)}
.nd:hover text,.nd.on text{fill:#fff}
.nd[data-n="2"] text,.nd[data-n="3"] text{fill:var(--g)}
.nd[data-n="2"].on text,.nd[data-n="3"].on text{fill:#8a6d27}
.flow{fill:none;stroke:var(--g);stroke-width:2.4;stroke-dasharray:6 6;animation:fl 1.1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
#mx{margin:16px auto 0;text-align:center;min-height:52px;max-width:60ch;border:0;padding:0;font-size:16px;color:var(--ink)}
/* charts */
.ch svg{width:100%;height:auto;display:block}
.gr path{stroke:#ebe5d4;stroke-width:1}.gr text,.at,.lb{font:11px Inter,'Noto Sans Armenian',sans-serif;fill:var(--mut)}
.ax{fill:none;stroke:var(--ink);stroke-width:1.4}
.ld,.ls{stroke-width:3.5;stroke-linecap:round;pointer-events:stroke}.ld{stroke:var(--g)}.ls{stroke:var(--gold)}
.lb{font-weight:600;font-size:12px}
.pl{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.6}
.pt{fill:var(--ink);stroke:var(--bg);stroke-width:2;cursor:pointer}.mk{fill:var(--g);stroke:#fff;stroke-width:2}
.ring{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pu 2s infinite}
@keyframes pu{from{transform:scale(.6);opacity:1}to{transform:scale(2);opacity:0}}
.gap{fill:rgba(197,163,90,.45)}.gap.sh{fill:rgba(31,77,58,.4)}
.ctl{display:grid;gap:10px 22px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:8px 0 14px}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}label b{color:var(--g)}
input[type=range]{width:100%;accent-color:var(--g)}
input:not([type=range]),select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--ln);background:#fff;font:inherit;color:var(--ink)}
.rd{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.kpi{background:rgba(31,77,58,.06);border-radius:14px;padding:10px 14px}.kpi small{display:block;color:var(--mut);font-size:12px}.kpi b{font:600 24px Newsreader,serif;color:var(--g)}
.st{margin:14px 0 10px;padding:12px 14px;border-radius:14px;font-size:15px;background:rgba(31,77,58,.07)}
.st.su{background:rgba(197,163,90,.22)}.st.sh{background:rgba(159,181,163,.35)}
.bars{display:grid;gap:8px}.bar2{height:9px;border-radius:9px;background:var(--ln);overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:var(--g);transition:width .5s}.bar2 i.gd2{background:var(--gold)}
.bars small{color:var(--mut);font-size:12px}
/* competition */
#cg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cc{text-align:left;cursor:pointer;font:inherit;color:inherit}.cc.on{background:var(--g);border-color:var(--g)}.cc.on h4{color:#fff}
.cc i{font:600 13px Inter;color:#8a6d27;font-style:normal}.cc.on i{color:var(--gold)}
#cp{margin-top:18px}#cp>*{animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px 18px;margin:0}dt{font-weight:600;color:var(--g)}dd{margin:0;color:var(--ink)}
@media(max-width:560px){dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:10px}}
/* sim, calc, quiz */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pills button{border:1px solid var(--ln);background:#fff;padding:9px 18px;border-radius:99px;cursor:pointer;font:500 14px Inter,'Noto Sans Armenian',sans-serif;transition:.25s}
.pills button.on{background:var(--g);color:#fff;border-color:var(--g)}
.res{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:rgba(31,77,58,.08);min-height:20px}.res:empty{display:none}.res.err{background:#f6e3df;color:#8a2b1c}
.form{display:grid;gap:12px}
.pg{height:7px;background:var(--ln);border-radius:7px;overflow:hidden;margin-bottom:18px}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--gold));transition:width .5s}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:1.5px solid var(--ln);background:#fff;padding:14px 16px;border-radius:14px;cursor:pointer;font:inherit;color:inherit;transition:.2s}
.opts:not(.dn) .opt:hover{border-color:var(--g);transform:translateX(4px)}
.dn .opt{cursor:default}.opt.ok{background:rgba(31,77,58,.14);border-color:var(--g)}.opt.bad{background:#f6e3df;border-color:#b5483a}
.ex{background:rgba(197,163,90,.18);padding:12px 14px;border-radius:12px}
.fin{text-align:center;padding:20px 0}.fin b{display:block;font:600 64px Newsreader,serif;color:var(--g)}
#qb small{color:var(--mut)}
footer{background:var(--g);color:#e9efe9;padding:56px 0 30px;margin-top:40px}
footer .logo{color:#fff}footer a{text-decoration:none;opacity:.85}footer a:hover{opacity:1}
.fg{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fn{display:flex;flex-direction:column;gap:6px;font-size:14px}
footer .lg{background:rgba(255,255,255,.12);width:max-content}footer .lg button{color:#cfdccf}
.fb{border-top:1px solid rgba(255,255,255,.18);margin-top:30px;padding-top:20px;font-size:14px;opacity:.85}
#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;background:var(--ink);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;max-width:240px;transition:opacity .15s}
#toast{position:fixed;bottom:22px;left:50%;translate:-50% 20px;background:var(--g);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:60;font-size:14px}
#toast.on{opacity:1;translate:-50% 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.hp{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="tip"></div><div id="toast"></div>
<header><div class="wrap bar">
<a class="logo" href="#home"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#1f4d3a"/><path d="M7 9L25 23M7 23L25 9" stroke="#c5a35a" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="#f7f3ea"/></svg>MarketGuide</a>
<nav id="nv"><a href="#home" data-a="nav" data-j="0"></a><a href="#market" data-a="nav" data-j="1"></a><a href="#demand" data-a="nav" data-j="2"></a><a href="#supply" data-a="nav" data-j="3"></a><a href="#eq" data-a="nav" data-j="4"></a><a href="#comp" data-a="nav" data-j="5"></a><a href="#graph" data-a="nav" data-j="6"></a><a href="#calc" data-a="nav" data-j="7"></a><a href="#quiz" data-a="nav" data-j="8"></a></nav>
<div class="lg"><button data-l="hy">ՀԱՅ</button><button data-l="ru">РУС</button><button data-l="en">ENG</button></div>
<button id="mb" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div></header>

<main>
<section id="home" class="hero"><div class="wrap hg">
<div><h1 data-i="h"></h1><p class="lead" data-i="hs"></p><div class="cta"><a class="btn" href="#market" data-i="b1"></a><a class="btn alt" href="#graph" data-i="b2"></a></div></div>
<div class="hw"><div class="hv" id="hv">
<svg viewBox="0 0 400 300"><g stroke="#ebe5d4"><path d="M30 50H370M30 110H370M30 170H370M30 230H370M90 30V270M170 30V270M250 30V270M330 30V270"/></g>
<path class="hp a" d="M30 60C120 80 200 160 370 250"/><path class="hp b" d="M30 250C120 220 230 120 370 50"/>
<circle cx="205" cy="152" r="7" fill="#22262a"/><circle class="ring" cx="205" cy="152" r="9"/></svg>
<div class="fl" style="top:6%;left:-2%;--k:22;--z:60px"><small data-a="sp" data-j="0"></small><b>֏ 450</b></div>
<div class="fl" style="top:12%;right:-2%;--k:-18;--z:90px"><small data-a="sp" data-j="2"></small><b>֏ 1 200</b></div>
<div class="fl" style="bottom:14%;left:4%;--k:-26;--z:40px"><small data-a="sp" data-j="1"></small><b>֏ 300</b></div>
<div class="fl" style="bottom:6%;right:2%;--k:16;--z:80px"><small data-a="sp" data-j="3"></small><b>֏ 189 000</b></div>
</div></div></div></section>

<section id="market"><div class="wrap">
<h2 data-i="mt"></h2><p class="lead" data-i="md"></p>
<div class="card rv"><svg id="mdg" viewBox="0 0 420 220"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f4d3a"/></marker></defs>
<g class="nd" data-n="2"><path class="flow" d="M300 80C250 20 170 20 120 80" marker-end="url(#ar)"/><text x="210" y="26" data-a="mn" data-j="2"></text></g>
<g class="nd" data-n="3"><path class="flow" d="M120 140C170 200 250 200 300 140" marker-end="url(#ar)"/><text x="210" y="212" data-a="mn" data-j="3"></text></g>
<g class="nd" data-n="0"><rect x="6" y="70" width="114" height="80" rx="18"/><text x="63" y="115" data-a="mn" data-j="0"></text></g>
<g class="nd" data-n="1"><rect x="300" y="70" width="114" height="80" rx="18"/><text x="357" y="115" data-a="mn" data-j="1"></text></g>
<g class="nd" data-n="4"><circle cx="210" cy="110" r="34"/><text x="210" y="115" data-a="mn" data-j="4"></text></g></svg>
<p id="mx" class="note"></p><p style="text-align:center;color:var(--mut);font-size:13px;margin:0" data-i="mh"></p></div>
</div></section>

<section id="demand"><div class="wrap">
<h2 data-i="dt"></h2><p class="lead" data-i="dd"></p>
<div id="ch-d" class="rv"></div>
<p class="note" data-i="dm" style="margin-top:20px"></p><p class="lead" data-i="dx"></p>
<div class="g3" id="fd"></div>
</div></section>

<section id="supply"><div class="wrap">
<h2 data-i="st"></h2><p class="lead" data-i="sd"></p>
<div id="ch-s" class="rv"></div>
<p class="note" data-i="sm" style="margin-top:20px"></p>
<div class="g3" id="fs"></div>
</div></section>

<section id="eq"><div class="wrap two">
<div><h2 data-i="et"></h2><p class="lead" data-i="ed"></p><p class="note" data-i="ex1"></p></div>
<div id="ch-e" class="rv"></div>
</div></section>

<section id="comp"><div class="wrap">
<h2 data-i="ct"></h2><div id="cg"></div><div class="card" id="cp"></div>
</div></section>

<section id="graph"><div class="wrap">
<h2 data-i="gt"></h2><p class="lead" data-i="gd"></p>
<div id="ch-g" class="rv"></div>
</div></section>

<section id="sim"><div class="wrap">
<h2 data-i="simT"></h2>
<div class="card rv"><div class="pills" id="sp"><button class="on" data-j="0" data-a="sp"></button><button data-j="1" data-a="sp"></button><button data-j="2" data-a="sp"></button><button data-j="3" data-a="sp"></button></div>
<div class="ctl">
<label><span data-a="sl" data-j="0"></span> <b id="v-p"></b><input type="range" id="s-p" min="1" max="60" value="30"></label>
<label><span data-a="sl" data-j="1"></span> <b id="v-dm"></b><input type="range" id="s-dm" min="50" max="150" value="100"></label>
<label><span data-a="sl" data-j="2"></span> <b id="v-sp"></b><input type="range" id="s-sp" min="50" max="150" value="100"></label>
<label><span data-a="sl" data-j="3"></span> <b id="v-ct"></b><input type="range" id="s-ct" min="0" max="40" value="0"></label></div>
<div class="rd">
<div class="kpi"><small data-a="so" data-j="0"></small><b id="o-p">0</b></div>
<div class="kpi"><small data-a="so" data-j="1"></small><b id="o-d">0</b></div>
<div class="kpi"><small data-a="so" data-j="2"></small><b id="o-s">0</b></div>
<div class="kpi"><small data-a="so" data-j="3"></small><b><span id="o-P">0</span> / <span id="o-Q">0</span></b></div>
<div class="kpi"><small data-a="so" data-j="4"></small><b id="o-t" style="font-size:19px"></b></div></div></div>
</div></section>

<section id="calc"><div class="wrap">
<h2 data-i="kt"></h2>
<div class="two" style="align-items:start">
<div class="card rv form"><h3 data-i="k1"></h3><label><span data-i="kn"></span><input id="c-n"></label><label><span data-i="kp"></span><input id="c-p" type="number" step="any" min="0"></label><label><span data-i="kq"></span><input id="c-q" type="number" step="any" min="0"></label><div><button class="btn" id="c-b" data-i="kb"></button></div><p class="note" data-i="kr" style="margin:0"></p><div class="res" id="c-r"></div></div>
<div class="card rv form"><h3 data-i="eqT"></h3><p class="note" data-i="eqD" style="margin:0"></p>
<label>a (Qd = a − b·P)<input id="e-a" type="number" step="any" value="100"></label><label>b<input id="e-b" type="number" step="any" value="2"></label><label>c (Qs = c + d·P)<input id="e-c" type="number" step="any" value="-20"></label><label>d<input id="e-d" type="number" step="any" value="3"></label>
<div><button class="btn" id="e-btn" data-i="kb"></button></div><div class="res" id="e-r"></div></div>
</div></div></section>

<section id="quiz"><div class="wrap"><h2 data-i="qT"></h2>
<div class="card rv" style="max-width:760px"><div class="pg"><i id="qp"></i></div><div id="qb"></div></div>
</div></section>
</main>

<footer><div class="wrap"><div class="fg">
<div><a class="logo" href="#home"><svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="9" fill="#c5a35a"/><path d="M7 9L25 23M7 23L25 9" stroke="#1f4d3a" stroke-width="2.4" stroke-linecap="round"/></svg>MarketGuide</a><p style="margin-top:12px" data-i="fd2"></p></div>
<div class="fn"><a href="#market" data-a="nav" data-j="1"></a><a href="#demand" data-a="nav" data-j="2"></a><a href="#supply" data-a="nav" data-j="3"></a><a href="#eq" data-a="nav" data-j="4"></a><a href="#comp" data-a="nav" data-j="5"></a></div>
<div class="fn"><a href="#graph" data-a="nav" data-j="6"></a><a href="#calc" data-a="nav" data-j="7"></a><a href="#quiz" data-a="nav" data-j="8"></a></div>
<div><p data-i="fl"></p><div class="lg"><button data-l="hy">ՀԱՅ</button><button data-l="ru">РУС</button><button data-l="en">ENG</button></div></div>
</div><div class="fb"><p data-i="fn"></p><p style="margin:0" data-i="fc"></p></div></div></footer>

<script>

/* ---------- charts ---------- */
const X=q=>46+q/120*350,Y=p=>236-p/50*224,cl=(v,a,b)=>Math.min(b,Math.max(a,v)),CH=[];
function chart(id,m){
 const el=$('#'+id),b=2,d=3,s0={A:100,C:-20,p:m=='g'?36:30},c={s:{...s0},t:{...s0}};
 let grid='';for(let p=0;p<=50;p+=10)grid+=`<path d="M46 ${Y(p)}H396"/><text x="40" y="${Y(p)+3}" text-anchor="end">${p}</text>`;
 for(let q=0;q<=120;q+=20)grid+=`<path d="M${X(q)} 12V236"/><text x="${X(q)}" y="250" text-anchor="middle">${q}</text>`;
 const ks={d:['p','A'],s:['p','C'],g:['p','A','C'],e:[]}[m],rg={p:[1,50],A:[60,140],C:[-60,20]},lb={p:'lp',A:'lA',C:'lC'},kp={d:['rd'],s:['rs'],e:['rP','rQ'],g:['rP','rQ','rd','rs']}[m];
 el.innerHTML=`<div class="card ch"><svg viewBox="0 0 420 270"><defs><clipPath id="cp${id}"><rect x="46" y="12" width="350" height="224"/></clipPath></defs><g class="gr">${grid}</g><path class="ax" d="M46 12V236H396"/><text class="at" x="50" y="10" data-i="P"></text><text class="at" x="396" y="266" text-anchor="end" data-i="Q"></text>
 <g clip-path="url(#cp${id})"><rect data-r="gap" rx="5"/><line data-r="D" class="ld" data-t="tD"/><line data-r="S" class="ls" data-t="tS"/></g>
 <path data-r="eg" class="pl"/><path data-r="pl" class="pl"/><text data-r="lD" class="lb" data-i="D"></text><text data-r="lS" class="lb" data-i="S"></text>
 <g data-r="ep"><circle class="ring" r="9"/><circle class="pt" r="6" data-t="tE"/></g><circle data-r="mk" class="mk" r="5"/></svg>
 <div class="ctl">${ks.map(k=>`<label><span data-i="${lb[k]}"></span> <b data-v="${k}"></b><input type="range" min="${rg[k][0]}" max="${rg[k][1]}" value="${s0[k]}" data-k="${k}"></label>`).join('')}</div>
 <div class="rd">${kp.map(k=>`<div class="kpi"><small data-i="${k}"></small><b data-r="${k}">0</b></div>`).join('')}</div>
 ${m=='g'?`<p class="st" data-r="st"></p><div class="bars"><div><small data-i="rd"></small><div class="bar2"><i data-r="bd"></i></div></div><div><small data-i="rs"></small><div class="bar2"><i class="gd2" data-r="bs"></i></div></div></div>`:''}</div>`;
 const r={};el.querySelectorAll('[data-r]').forEach(n=>r[n.dataset.r]=n);
 const sh=(n,v)=>n.style.display=v?'':'none',at=(n,o)=>{for(const k in o)n.setAttribute(k,o[k])};
 function draw(){const{A,C,p}=c.s,P=(A-C)/(b+d),Q=A-b*P,qd=Math.max(0,A-b*p),qs=Math.max(0,C+d*p),yp=Y(p);
  at(r.D,{x1:X(A),y1:Y(0),x2:X(A-b*50),y2:Y(50)});at(r.S,{x1:X(C),y1:Y(0),x2:X(C+d*50),y2:Y(50)});
  const pd=Math.min(46,(A-6)/b),ps=Math.min(46,(116-C)/d);
  at(r.lD,{x:cl(X(A-b*pd)+8,50,330),y:Y(pd)+4});at(r.lS,{x:cl(X(C+d*ps)-8,60,392),y:Y(ps)+4,'text-anchor':'end'});
  sh(r.D,m!='s');sh(r.lD,m!='s');sh(r.S,m!='d');sh(r.lS,m!='d');
  sh(r.ep,m=='e'||m=='g');sh(r.eg,m=='e'||m=='g');sh(r.pl,m=='d'||m=='s'||m=='g');sh(r.mk,m=='d'||m=='s');sh(r.gap,m=='g');
  r.ep.setAttribute('transform',`translate(${X(Q)} ${Y(P)})`);r.eg.setAttribute('d',`M46 ${Y(P)}H${X(Q)}V236`);
  if(m=='d'||m=='s'){const q=m=='d'?qd:qs;r.pl.setAttribute('d',`M46 ${yp}H${X(q)}V236`);at(r.mk,{cx:X(q),cy:yp})}
  if(m=='g'){r.pl.setAttribute('d',`M46 ${yp}H${X(Math.max(qd,qs))}`);at(r.gap,{x:X(Math.min(qd,qs)),y:yp-5,width:X(Math.abs(qd-qs))-46,height:10});r.gap.setAttribute('class',qs>qd?'gap':'gap sh')}}
 function upd(){const{A,C,p}=c.t,P=(A-C)/(b+d),Q=A-b*P,qd=Math.max(0,A-b*p),qs=Math.max(0,C+d*p),v={rP:P,rQ:Q,rd:qd,rs:qs};
  kp.forEach(k=>an(r[k],v[k],1));el.querySelectorAll('[data-v]').forEach(n=>n.textContent=c.t[n.dataset.v]);
  if(m=='g'){const df=qs-qd,ok=Math.abs(p-P)<.5;r.st.textContent=ok?T('eqs'):T(df>0?'sur':'sho')+' ('+T('rg')+': '+Math.abs(df).toFixed(1)+')';r.st.className='st '+(ok?'':df>0?'su':'sh');r.bd.style.width=Math.min(100,qd/1.2)+'%';r.bs.style.width=Math.min(100,qs/1.2)+'%'}}
 let on=0;function loop(){if(on)return;on=1;(function f(){let mv=0;for(const k in c.t){const dl=c.t[k]-c.s[k];if(Math.abs(dl)>.05){c.s[k]+=dl*.14;mv=1}else c.s[k]=c.t[k]}draw();if(mv)requestAnimationFrame(f);else on=0})()}
 el.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){c.t[k]=+e.target.value;upd();loop()}});
 if(m=='e'){const st=[[100,-20],[130,-20],[130,-50],[80,-30]];let i=0;setInterval(()=>{i=(i+1)%4;[c.t.A,c.t.C]=st[i];upd();loop()},2600)}
 draw();upd();CH.push(upd);
}

/* ---------- calculators ---------- */
function calc1(){const o=$('#c-r'),n=$('#c-n').value.trim(),p=parseFloat($('#c-p').value),q=parseFloat($('#c-q').value);
 if(!isFinite(p)||!isFinite(q)){o.className='res err';o.textContent=T('e1');return}
 if(p<0||q<0){o.className='res err';o.textContent=T('e2');return}
 o.className='res';o.innerHTML='';o.append((n||'—')+': '+p+' × '+q+' = ');const b=document.createElement('b');b.textContent=(p*q).toLocaleString(lc[lg])+' ֏';o.append(b)}
function calc2(){const o=$('#e-r'),v=['e-a','e-b','e-c','e-d'].map(i=>parseFloat($('#'+i).value)),er=k=>{o.className='res err';o.textContent=T(k)};
 if(v.some(x=>!isFinite(x)))return er('e1');const[a,b,c,d]=v;if(b+d===0)return er('e3');const P=(a-c)/(b+d),Q=a-b*P;if(P<=0||Q<=0)return er('e4');
 o.className='res';o.innerHTML=`${T('rP')}: <b>${+P.toFixed(2)} ֏</b> · ${T('rQ')}: <b>${+Q.toFixed(2)}</b>`}
$('#c-b').onclick=()=>{c1=1;calc1()};$('#e-btn').onclick=()=>{c2=1;calc2()};

/* ---------- quiz ---------- */
let qi=0,sc=0,ch=-1;
function rQ(){const z=T('qz').split('~').map(x=>x.split('|')),n=z.length,bx=$('#qb');$('#qp').style.width=Math.min(100,(qi+(ch>=0?1:0))/n*100)+'%';
 if(qi>=n){bx.innerHTML=`<div class="fin"><b>${sc}/${n}</b><p>${A('qm')[sc>=9?2:sc>=6?1:0]}</p><button class="btn" id="qr">${T('qr')}</button></div>`;return}
 const q=z[qi],ok=+q[5];
 bx.innerHTML=`<small>${T('qq')} ${qi+1}/${n} · ${T('qs')}: ${sc}</small><h3 style="margin-top:6px">${q[0]}</h3><div class="opts ${ch>=0?'dn':''}">${[1,2,3,4].map(i=>`<button class="opt ${ch>=0?(i-1==ok?'ok':i-1==ch?'bad':''):''}" data-o="${i-1}">${q[i]}</button>`).join('')}</div>${ch>=0?`<p class="ex"><b>${ch==ok?T('qc'):T('qw')}</b> ${q[6]}</p><button class="btn" id="qx">${qi==n-1?T('qf'):T('qn')}</button>`:''}`}
$('#qb').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.o!==undefined&&ch<0){ch=+t.dataset.o;if(ch==+T('qz').split('~')[qi].split('|')[5])sc++;rQ()}
